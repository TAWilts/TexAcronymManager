name: Linux compatibility

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb
      - name: Install TAcroMan
        run: |
          python3 -m venv --system-site-packages .venv-linux
          .venv-linux/bin/python -m pip install --upgrade pip
          .venv-linux/bin/python -m pip install -e .
      - name: Verify Linux GUI runtimes
        run: |
          xvfb-run -a .venv-linux/bin/python -c "import tkinter as tk; root=tk.Tk(); root.withdraw(); root.update_idletasks(); root.destroy()"
          .venv-linux/bin/python -c "import gi; gi.require_version('Gtk', '3.0'); gi.require_version('WebKit2', '4.1'); from gi.repository import Gtk, WebKit2"
      - name: Run Python tests
        run: .venv-linux/bin/python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run VS Code extension tests
        working-directory: vscode-extension
        run: |
          npm install --no-fund --no-audit
          npm test
