[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tacroman"
version = "1.0.0"
description = "A desktop and VS Code manager for profile-defined LaTeX commands"
requires-python = ">=3.10"
dependencies = [
  "pywebview>=6.2,<7",
]
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "Thomas Wilts"}]

[project.urls]
Homepage = "https://github.com/TAWilts/TexAcronymManager"
Repository = "https://github.com/TAWilts/TexAcronymManager"
Issues = "https://github.com/TAWilts/TexAcronymManager/issues"

[project.scripts]
tacroman = "tacroman.web_app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
tacroman = ["defaults/*.json", "web_ui/*.css", "web_ui/*.html", "web_ui/*.js"]
